# USD per million tokens, standard tier.
# Override or extend with ~/.tokenguard/pricing.toml (same format).
#
# Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-03)
# OpenAI:    https://developers.openai.com/api/docs/pricing         (checked 2026-10-03)

[modifiers.anthropic]
fast_multiplier = 2.0        # fast mode on Opus 5.5 / Opus 5 / Opus 4.8
us_geo_multiplier = 1.1      # inference_geo = "us", Claude 4.6 and later
web_search_per_request = 0.01  # $10 per 1,000 searches

# --- Anthropic -------------------------------------------------------------
# input = base input, cache_write_5m / cache_write_1h = cache writes,
# cache_read = cache hits and refreshes, output = output tokens.

[anthropic."claude-fable-5-1"]
input = 10.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 0.25
output = 50.0

